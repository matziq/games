<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a10" />
    <title>Aztec Hero</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const developmentEntry = document.querySelector('script[src="./src/main.ts"]');
        if (location.protocol === 'file:' && developmentEntry) {
          location.replace(new URL('./dist/index.html', location.href));
        }
      });
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a10;
        --panel: rgba(16, 20, 28, 0.72);
        --panel-border: rgba(255, 255, 255, 0.12);
        --gold: #c4a060;
        --gold-strong: #f4d06b;
        --text: rgba(255, 255, 255, 0.92);
        --safe-top: max(0px, env(safe-area-inset-top));
        --safe-right: max(0px, env(safe-area-inset-right));
        --safe-bottom: max(0px, env(safe-area-inset-bottom));
        --safe-left: max(0px, env(safe-area-inset-left));
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        position: relative;
      }

      #app {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        display: grid;
        place-items: center;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #debug {
        position: fixed;
        left: calc(10px + var(--safe-left));
        top: calc(10px + var(--safe-top));
        max-width: min(92vw, 720px);
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.55);
        color: rgba(255, 255, 255, 0.92);
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        z-index: 9999;
      }

      .hint {
        position: fixed;
        left: calc(12px + var(--safe-left));
        bottom: calc(12px + var(--safe-bottom));
        color: rgba(255, 255, 255, 0.75);
        font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
        user-select: none;
        pointer-events: none;
      }

      .hint kbd {
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        font-weight: 650;
      }

      .menu-link {
        position: fixed;
        top: calc(10px + var(--safe-top));
        left: calc(12px + var(--safe-left));
        z-index: 9998;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        color: var(--gold);
        transition: color 0.15s;
        letter-spacing: 0.3px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      .menu-link:hover { color: #e0c080; }

      #touch-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(0px + var(--safe-bottom));
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        padding: 12px calc(16px + var(--safe-right)) 12px calc(16px + var(--safe-left));
        z-index: 9000;
        pointer-events: none;
      }

      @media (pointer: coarse) {
        #touch-controls {
          display: flex;
        }
      }

      #touch-controls * { pointer-events: auto; }

      #tc-dpad {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .tc-dpad-row {
        display: flex;
        gap: 4px;
      }

      .tc-btn {
        all: unset;
        cursor: pointer;
        width: 54px;
        height: 54px;
        min-width: 48px;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font-size: 20px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .tc-btn:active,
      .tc-btn.pressed {
        background: rgba(255, 255, 255, 0.28);
        transform: scale(0.93);
      }

      #tc-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      .tc-action {
        width: 68px;
        height: 68px;
        min-width: 48px;
        min-height: 48px;
        border-radius: 50%;
        font-size: 14px;
        font-weight: 800;
        background: rgba(100, 200, 100, 0.18);
        border-color: rgba(100, 200, 100, 0.35);
      }

      .tc-interact {
        width: 54px;
        height: 54px;
        min-width: 48px;
        min-height: 48px;
        font-size: 16px;
        background: rgba(200, 160, 60, 0.18);
        border-color: rgba(200, 160, 60, 0.35);
      }

      #aztec-hs-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10000;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        color: #e8ecf1;
      }

      #aztec-hs-modal > div {
        background: #121722;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 26px;
        min-width: 290px;
        max-width: 88%;
        max-height: 80vh;
        overflow-y: auto;
      }

      #aztecScoresBtn {
        position: fixed;
        top: calc(12px + var(--safe-top));
        right: calc(12px + var(--safe-right));
        z-index: 9999;
        padding: 6px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.55);
        color: var(--gold);
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }

      #restart-control {
        position: fixed;
        left: 50%;
        bottom: calc(18px + var(--safe-bottom));
        z-index: 10001;
        display: none;
        min-width: 120px;
        min-height: 48px;
        transform: translateX(-50%);
        border: 1px solid #f4d06b;
        border-radius: 12px;
        background: #c4a060;
        color: #070a10;
        font: 800 15px/1 system-ui, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
      }

      #restart-control:focus-visible,
      .tc-btn:focus-visible,
      #aztecScoresBtn:focus-visible {
        outline: 3px solid #f4d06b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug">Booting…</div>
    <div class="hint">Move: <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> · Jump: <kbd>Space</kbd> · Interact: <kbd>E</kbd></div>

    <div id="touch-controls" aria-label="Touch controls">
      <div id="tc-dpad">
        <div class="tc-dpad-row">
          <button type="button" id="tc-up" class="tc-btn" data-input="up" aria-label="Up">▲</button>
        </div>
        <div class="tc-dpad-row">
          <button type="button" id="tc-left" class="tc-btn" data-input="left" aria-label="Left">◀</button>
          <button type="button" id="tc-down" class="tc-btn" data-input="down" aria-label="Down">▼</button>
          <button type="button" id="tc-right" class="tc-btn" data-input="right" aria-label="Right">▶</button>
        </div>
      </div>
      <div id="tc-actions">
        <button type="button" id="tc-jump" class="tc-btn tc-action" data-input="jump" aria-label="Jump">JUMP</button>
        <button type="button" id="tc-interact" class="tc-btn tc-action tc-interact" data-input="interact" aria-label="Interact">E</button>
      </div>
    </div>

    <div id="aztec-hs-modal">
      <div>
        <h2 style="text-align:center;margin:0 0 18px;font-size:22px;color:#c4a060;">🏆 High Scores</h2>
        <div id="aztec-hs-wrap"></div>
        <div id="aztec-name-entry" style="display:none;margin:10px 0;text-align:center;">
          <div style="font-size:13px;color:#c4a060;margin-bottom:6px;">Enter your name:</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
            <input id="aztec-hs-name" type="text" maxlength="6" autocomplete="off" spellcheck="false" style="width:120px;padding:6px 10px;font-size:18px;font-weight:bold;text-align:center;background:#1a1f2c;color:#e8ecf1;border:2px solid #c4a060;border-radius:8px;outline:none;text-transform:uppercase;letter-spacing:2px;font-family:inherit;" placeholder="______" />
            <button id="aztec-save-name" style="padding:6px 14px;font-size:14px;font-weight:700;background:#c4a060;color:#000;border:none;border-radius:8px;cursor:pointer;">Save</button>
          </div>
          <div id="aztec-name-saved" style="font-size:11px;color:#35dd8a;margin-top:4px;display:none;">✓ Name saved!</div>
          <div id="aztec-name-hint" style="font-size:10px;color:#90a0b7;margin-top:3px;">Up to 6 letters</div>
        </div>
        <button id="aztecHsClose" style="width:100%;padding:11px;margin-top:18px;background:#c4a060;color:#000;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;">Close</button>
      </div>
    </div>

    <button id="aztecScoresBtn" aria-label="Open high scores">🏆 Scores</button>
    <button type="button" id="restart-control" data-input="restart">RESTART</button>

    <script type="module">
      import './src/githubScores.ts';
      import { InputState } from './src/input/InputState.ts';

      const inputState = new InputState();
      window.__aztecInput = inputState;

      const touchControls = document.getElementById('touch-controls');
      const restartControl = document.getElementById('restart-control');
      inputState.bindControls(document.body);
      window.__aztecSetRestartVisible = (visible, label = 'RESTART') => {
        if (!restartControl) return;
        restartControl.textContent = label;
        restartControl.style.display = visible ? 'block' : 'none';
      };

      const prefersCoarse = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      if (!prefersCoarse) {
        touchControls?.setAttribute('style', 'display: none !important');
      }

      const debug = document.getElementById('debug');
      const log = (msg) => {
        if (debug) {
          debug.textContent = String(msg);
          debug.hidden = false;
        }
      };
      window.__aztecDebug = {
        log,
        append: (msg) => {
          if (debug) {
            debug.textContent += `\n${msg}`;
            debug.hidden = false;
          }
        },
        hide: () => {
          if (debug) debug.hidden = true;
        }
      };

      window.addEventListener('error', (event) => {
        log(`JS error: ${event.message}\n${event.filename}:${event.lineno}:${event.colno}\n${event.error?.stack || ''}`);
      });
      window.addEventListener('unhandledrejection', (event) => {
        log(`Unhandled promise rejection:\n${event.reason?.stack || event.reason}`);
      });

      const AZ_HS_KEY = 'aztecHero-highscores';
      let azLastIdx = -1;
      let azPending = null;

      function getAzHs() {
        try {
          const scores = JSON.parse(localStorage.getItem(AZ_HS_KEY) || '[]');
          return Array.isArray(scores) ? scores : [];
        } catch {
          return [];
        }
      }

      function addAzHs(gems, name, escaped) {
        const list = getAzHs();
        const entry = { score: gems, name: (name || '').toUpperCase(), escaped, date: new Date().toISOString() };
        let inserted = false;
        for (let i = 0; i < list.length; i += 1) {
          if (gems > list[i].score) {
            list.splice(i, 0, entry);
            inserted = true;
            azLastIdx = i;
            break;
          }
        }
        if (!inserted && list.length < 5) {
          azLastIdx = list.length;
          list.push(entry);
          inserted = true;
        } else if (!inserted) {
          azLastIdx = -1;
          return false;
        }
        if (list.length > 5) list.length = 5;
        localStorage.setItem(AZ_HS_KEY, JSON.stringify(list));
        if (window.GHScores) {
          window.GHScores.save('aztec_hero', AZ_HS_KEY).catch((error) => console.error('High score sync failed', error));
        }
        return true;
      }

      function renderAzHs() {
        const list = getAzHs();
        const wrap = document.getElementById('aztec-hs-wrap');
        if (!wrap) return;
        wrap.replaceChildren();
        if (!list.length) {
          const empty = document.createElement('p');
          empty.style.cssText = 'text-align:center;color:#90a0b7;padding:30px 0;';
          empty.textContent = 'No scores yet.';
          wrap.append(empty);
          return;
        }

        const medalColors = ['#edc53f', '#c0c0c0', '#cd7f32'];
        const table = document.createElement('table');
        table.style.cssText = 'width:100%;border-collapse:collapse;';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['#', 'Gems', 'Name', 'Result', 'Date'].forEach((label, index) => {
          const th = document.createElement('th');
          th.style.cssText = `font-size:11px;text-transform:uppercase;color:#90a0b7;padding:6px 8px;text-align:${index === 0 ? 'center' : 'left'};border-bottom:1px solid #333;`;
          th.textContent = label;
          headerRow.append(th);
        });
        thead.append(headerRow);
        const tbody = document.createElement('tbody');
        list.forEach((entry, index) => {
          const date = new Date(entry.date);
          const ds = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
          const result = entry.escaped ? '✅ Escaped' : '❌ Died';
          const row = document.createElement('tr');
          if (index === azLastIdx) row.style.background = 'rgba(196,160,96,0.06)';
          const values = [String(index + 1), String(entry.score), entry.name || '---', result, ds];
          values.forEach((value, cellIndex) => {
            const td = document.createElement('td');
            td.style.cssText = 'padding:10px 8px;border-bottom:1px solid #222;';
            if (cellIndex === 0) {
              td.style.textAlign = 'center';
              td.style.fontWeight = '700';
              if (index < 3) td.style.color = medalColors[index];
            } else if (cellIndex === 1) {
              td.style.fontWeight = '900';
              td.style.color = '#c4a060';
            } else if (cellIndex === 2) {
              td.style.fontWeight = '700';
            } else if (cellIndex === 4) {
              td.style.fontSize = '11px';
              td.style.color = '#90a0b7';
            }
            td.textContent = value;
            row.append(td);
          });
          tbody.append(row);
        });
        table.append(thead, tbody);
        wrap.append(table);
      }

      function showAzHs() {
        renderAzHs();
        const entry = document.getElementById('aztec-name-entry');
        if (entry) entry.style.display = 'none';
        const modal = document.getElementById('aztec-hs-modal');
        if (modal) modal.style.display = 'flex';
      }

      function hideAzHs() {
        const modal = document.getElementById('aztec-hs-modal');
        if (modal) modal.style.display = 'none';
        azLastIdx = -1;
      }

      function saveAzName() {
        const inp = document.getElementById('aztec-hs-name');
        if (!inp || inp.disabled) return;
        const name = inp.value.replace(/[^a-zA-Z]/g, '').substring(0, 6).toUpperCase();
        if (azPending) {
          addAzHs(azPending.gems, name, azPending.escaped);
          azPending = null;
        }
        inp.disabled = true;
        inp.value = name || '------';
        inp.style.borderColor = '#35dd8a';
        const btn = document.getElementById('aztec-save-name');
        if (btn) {
          btn.textContent = '✓';
          btn.style.background = '#35dd8a';
          btn.disabled = true;
        }
        const saved = document.getElementById('aztec-name-saved');
        if (saved) saved.style.display = 'block';
        const hint = document.getElementById('aztec-name-hint');
        if (hint) hint.style.display = 'none';
        renderAzHs();
      }

      window.__aztecGameEnd = function (gems, escaped) {
        const list = getAzHs();
        const makesLeaderboard = gems > 0 && (list.length < 5 || gems > list[list.length - 1].score);
        if (makesLeaderboard) {
          azPending = { gems, escaped };
          const entry = document.getElementById('aztec-name-entry');
          if (entry) entry.style.display = 'block';
          const inp = document.getElementById('aztec-hs-name');
          if (inp) {
            inp.value = '';
            inp.disabled = false;
            inp.style.borderColor = '#c4a060';
          }
          const btn = document.getElementById('aztec-save-name');
          if (btn) {
            btn.textContent = 'Save';
            btn.style.background = '#c4a060';
            btn.disabled = false;
          }
          const saved = document.getElementById('aztec-name-saved');
          if (saved) saved.style.display = 'none';
          const hint = document.getElementById('aztec-name-hint');
          if (hint) hint.style.display = '';
          renderAzHs();
          const modal = document.getElementById('aztec-hs-modal');
          if (modal) modal.style.display = 'flex';
          setTimeout(() => document.getElementById('aztec-hs-name')?.focus(), 100);
        } else {
          addAzHs(gems, '', escaped);
        }
      };

      document.getElementById('aztecScoresBtn')?.addEventListener('click', showAzHs);
      document.getElementById('aztecHsClose')?.addEventListener('click', () => {
        if (azPending) {
          const inp = document.getElementById('aztec-hs-name');
          const name = inp && !inp.disabled ? inp.value.replace(/[^a-zA-Z]/g, '').substring(0, 6).toUpperCase() : '';
          addAzHs(azPending.gems, name, azPending.escaped);
          azPending = null;
        }
        hideAzHs();
      });
      document.getElementById('aztec-save-name')?.addEventListener('click', saveAzName);
      document.getElementById('aztec-hs-name')?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          saveAzName();
        }
      });

      if (window.GHScores) {
        window.GHScores.load('aztec_hero', 'aztecHero-highscores', 5)
          .catch((error) => console.warn('High score load failed; using local scores', error));
      }
    </script>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
