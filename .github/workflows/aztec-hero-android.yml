name: Build Aztec Hero Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "aztec_hero/**"
      - ".github/workflows/aztec-hero-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aztec_hero/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: aztec_hero
        run: npm ci

      - name: Run focused tests
        working-directory: aztec_hero
        run: npm test

      - name: Typecheck
        working-directory: aztec_hero
        run: npm run typecheck

      - name: Build web assets
        working-directory: aztec_hero
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: aztec_hero
        run: npx cap sync android

      - name: Build debug APK
        working-directory: aztec_hero/android
        shell: bash
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aztec-hero-debug-apk
          path: aztec_hero/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
