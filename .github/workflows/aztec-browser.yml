name: Aztec browser game

on:
  push:
    paths:
      - "Aztec/**"
      - ".github/workflows/aztec-browser.yml"
  pull_request:
    paths:
      - "Aztec/**"
      - ".github/workflows/aztec-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --check Aztec/engine.js && node --check Aztec/game.js
      - name: Test dungeon and complete expeditions
        run: node --test Aztec/engine.test.cjs
      - name: Build offline release
        run: node Aztec/build-release.cjs "$RUNNER_TEMP/Aztec.html"
      - uses: actions/upload-artifact@v4
        with:
          name: Aztec-offline
          path: ${{ runner.temp }}/Aztec.html
