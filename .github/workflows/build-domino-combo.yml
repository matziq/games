name: Build Domino Combo APK

on:
  workflow_dispatch:
  push:
    paths:
      - "domino_combo/**"
      - "apk_builds/domino_combo/**"
      - "apk_builds/package*.json"
      - ".github/workflows/build-domino-combo.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Check canonical gameplay source
        uses: actions/checkout@v5
        with:
          repository: matziq/domino-combo
          ref: main
          path: .domino-upstream
          sparse-checkout: |
            index.html
            src
            public
          sparse-checkout-cone-mode: false

      - name: Reject stale gameplay copies
        run: |
          diff -u .domino-upstream/index.html domino_combo/index.html
          diff -ru .domino-upstream/src domino_combo/src
          diff -ru .domino-upstream/public domino_combo/public
          echo "Canonical gameplay revision: $(git -C .domino-upstream rev-parse HEAD)"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apk_builds/package-lock.json
            domino_combo/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build the web app
        working-directory: domino_combo
        run: npm ci && npm test && npm run lint && npm run build

      - name: Install Capacitor
        working-directory: apk_builds
        run: npm ci

      - name: Sync web assets
        shell: pwsh
        run: |
          Copy-Item domino_combo/dist/* apk_builds/domino_combo/www/ -Recurse -Force
          Set-Location apk_builds/domino_combo
          npx cap sync android

      - name: Build debug APK
        working-directory: apk_builds/domino_combo/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item apk_builds/domino_combo/android/app/build/outputs/apk/debug/app-debug.apk domino_combo/domino_combo.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging domino_combo/domino_combo.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose domino_combo/domino_combo.apk
          python domino_combo/scripts/verify-apk.py domino_combo/domino_combo.apk
          unzip -p domino_combo/domino_combo.apk assets/public/index.html | node domino_combo/scripts/verify-bundle.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: domino-combo-apk
          path: domino_combo/domino_combo.apk
          if-no-files-found: error
