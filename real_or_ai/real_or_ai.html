<!DOCTYPE html>
<html>

<head>
	<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
	<link rel="apple-touch-icon" href="../favicon.svg" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<title>Real or AI</title>
	<style>
		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			background: #111;
		}

		body {
			font-family: Arial, sans-serif;
			color: #fff;
			text-align: center;
		}

		.menu-link {
			display: block;
			text-align: center;
			font-size: 13px;
			font-weight: 700;
			color: #09f;
			text-decoration: none;
			padding: 4px 0;
			transition: color 0.15s;
			letter-spacing: 0.3px;
		}

		.menu-link:hover {
			color: #4dc3ff;
		}

		.menu-link:focus-visible {
			outline: 3px solid rgba(0, 153, 255, .6);
			outline-offset: 2px;
		}

		.game-container {
			margin: 0;
			width: 100%;
			height: 100dvh;
			max-height: 100dvh;
			min-height: 0;
			max-width: none;
			background: #222;
			border-radius: 0;
			padding: 8px 16px 72px;
			box-sizing: border-box;
			box-shadow: none;
			display: flex;
			flex-direction: column;
			align-items: center;
			overflow: hidden;
		}

		.game-container h1 {
			margin: 2px 0;
			font-size: clamp(1.15rem, 3vh, 1.7rem);
			flex: 0 0 auto;
		}

		#round-info,
		#instructions,
		#feedback,
		.score {
			flex: 0 0 auto;
			margin: 2px 0;
		}

		#feedback {
			max-height: 22vh;
			overflow: auto;
		}

		.images {
			display: flex;
			justify-content: center;
			align-items: stretch;
			gap: 32px;
			margin: 8px 0;
			width: 100%;
			flex: 1 1 auto;
			min-height: 0;
			overflow: hidden;
			flex-wrap: nowrap;
		}

		.images img {
			width: 100%;
			height: 0;
			flex: 1 1 auto;
			min-height: 0;
			max-width: 100%;
			object-fit: contain;
			background: #111;
			cursor: zoom-in;
			-webkit-user-drag: none;
		}

		@media (max-width: 720px) {
			.images {
				gap: 8px;
			}
		}


		.score {
			font-size: 1.1em;
			margin: 4px 0;
		}

		.btn {
			background: #09f;
			color: #fff;
			border: none;
			padding: 8px 22px;
			border-radius: 6px;
			font-size: 1em;
			cursor: pointer;
			margin-top: 6px;
			flex: 0 0 auto;
		}

		.btn:disabled {
			background: #555;
			cursor: not-allowed;
		}

		#instructions {
			font-size: 1.05em;
			margin: 2px 0;
			color: #ffd700;
			flex: 0 0 auto;
		}

		#instructions .ai-emphasis {
			color: #ff4da6;
			font-weight: 900;
			letter-spacing: 0.03em;
			text-transform: uppercase;
			text-decoration: underline;
			text-decoration-thickness: 3px;
			text-underline-offset: 4px;
			text-shadow:
				0 0 6px rgba(255, 77, 166, 0.8),
				0 0 18px rgba(255, 77, 166, 0.5);
		}

		/* Image wrapper for fullscreen toggle */
		.img-wrap {
			position: relative;
			display: flex;
			flex-direction: column;
			width: calc(50% - 16px);
			max-width: 860px;
			align-self: stretch;
			height: 100%;
			max-height: 100%;
			min-height: 0;
			border: 4px solid #444;
			border-radius: 8px;
			overflow: hidden;
			transition: border-color 0.2s;
		}

		.img-wrap img {
			width: 100%;
		}

		.img-zoom-btn {
			position: absolute;
			top: 8px;
			right: 8px;
			width: 32px;
			height: 32px;
			border-radius: 8px;
			border: none;
			background: rgba(0, 0, 0, 0.55);
			color: #fff;
			font-size: 16px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 5;
			opacity: 0.7;
			transition: opacity 0.15s;
		}

		.img-zoom-btn:hover {
			opacity: 1;
		}

		/* Full-size image viewer */
		#img-fullscreen {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 100000;
			background: rgba(0, 0, 0, 0.94);
			overflow: hidden;
			touch-action: none;
			cursor: zoom-out;
			-webkit-user-select: none;
			user-select: none;
		}

		#img-fullscreen.show {
			display: block;
		}

		#fs-stage {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		#img-fullscreen img {
			max-width: 96vw;
			max-height: 96vh;
			object-fit: contain;
			border-radius: 8px;
			transform-origin: center center;
			pointer-events: auto;
			cursor: zoom-in;
			touch-action: none;
			-webkit-user-drag: none;
			user-select: none;
		}

		#img-fullscreen.zoomed img {
			cursor: grab;
		}

		#img-fullscreen.dragging img {
			cursor: grabbing;
		}

		#fs-close {
			position: absolute;
			top: 12px;
			right: 12px;
			z-index: 2;
			margin: 0;
			padding: 8px 16px;
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 8px;
			cursor: pointer;
		}

		#fs-hint {
			position: absolute;
			left: 50%;
			bottom: 14px;
			transform: translateX(-50%);
			z-index: 2;
			margin: 0;
			padding: 6px 10px;
			border-radius: 8px;
			background: rgba(0, 0, 0, 0.55);
			color: #ddd;
			font-size: 13px;
			pointer-events: none;
		}

		@media (max-width: 720px) {
			.images {
				gap: 8px;
			}

			.img-wrap {
				width: calc(50% - 4px);
			}

			.choose-btn {
				font-size: 0.85em;
				padding: 8px 2px;
			}
		}

		.choose-btn {
			display: block;
			width: 100%;
			margin-top: 6px;
			padding: 8px 0;
			flex: 0 0 auto;
			font-size: 1.05em;
			font-weight: 700;
			border-radius: 8px;
			background: #09f;
			color: #fff;
			border: none;
			cursor: pointer;
			transition: background 0.15s;
		}

		.choose-btn:hover:not(:disabled) {
			background: #0bf;
		}

		.choose-btn:disabled {
			background: #555;
			cursor: not-allowed;
			opacity: 0.6;
		}

		.img-wrap.right {
			border-color: #3f3;
		}

		.img-wrap.wrong {
			border-color: #f33;
		}

		.img-wrap.right .choose-btn {
			background: #3f3;
			color: #222;
		}

		.img-wrap.wrong .choose-btn {
			background: #f33;
			color: #fff;
		}
	</style>
</head>

<body>
	<div class="game-container">
		<h1>Real or AI?</h1>
		<div id="round-info"></div>
		<div id="instructions">Choose the <span class="ai-emphasis">AI</span> image</div>
		<div class="images" id="images"></div>
		<div id="feedback"></div>
		<div class="score" id="score"></div>
		<button class="btn" id="nextBtn" style="display:none;">Next</button>
		<button class="btn" id="restartBtn" style="display:none;">Restart</button>
		<button class="btn" id="roaiScoresBtn" style="background:#ffd700;color:#222;margin-top:6px;">🏆 High
			Scores</button>
	</div>

	<div id="img-fullscreen" oncontextmenu="return false">
		<div id="fs-stage">
			<img id="fs-img" src="" alt="Fullscreen image">
		</div>
		<button type="button" id="fs-close">Close</button>
		<p id="fs-hint">Scroll to zoom. Drag when zoomed.</p>
	</div>

	<div id="roai-hs-modal"
		style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);z-index:20;">
		<div
			style="background:#333;border:1px solid #555;border-radius:16px;padding:26px;min-width:290px;max-width:88%;max-height:80vh;overflow-y:auto;color:#fff;font-family:inherit;text-align:left;">
			<h2 style="text-align:center;margin:0 0 18px;font-size:22px;color:#ffd700;">🏆 High Scores</h2>
			<div id="roai-hs-wrap"></div>
			<button class="btn" id="roaiHsClose" style="width:100%;margin-top:18px;">Close</button>
		</div>
	</div>
	<script src="image_manifest.js"></script>
	<script>
		// Dynamic image loading - will be populated by scanning folders
		let aiImages = [];
		let realImages = [];
		let signImages = [];
		let totalRounds = 0;

		function setScanStatus(text) {
			const imagesEl = document.getElementById('images');
			if (imagesEl) imagesEl.innerHTML = `<p>${text}</p>`;
		}

		function getManifest() {
			return (window.__REAL_OR_AI_MANIFEST__ && typeof window.__REAL_OR_AI_MANIFEST__ === 'object')
				? window.__REAL_OR_AI_MANIFEST__
				: null;
		}

		function unique(list) {
			return Array.from(new Set(list));
		}

		function takeFirst(list, n) {
			return list.slice(0, Math.max(0, n));
		}

		// Function to dynamically load images from folders
		async function loadImagesFromFolders() {
			setScanStatus('Loading image manifest...');
			try {
				const manifest = getManifest();
				if (manifest) {
					// Use manifest for file:// compatibility (no fetch required).
					aiImages = unique(manifest.ai || []);
					realImages = unique(manifest.real || []);
					signImages = unique(manifest.sign || []);
				} else {
					// Fallback: try to scrape a directory listing (works only when served by a web server that
					// exposes directory indexes). This usually won't work under file://.
					setScanStatus('Scanning folders for images...');
					const [aiResponse, realResponse, signResponse] = await Promise.all([
						fetch('ai/'),
						fetch('real/'),
						fetch('ai_sign/').catch(() => null),
					]);
					const [aiText, realText] = await Promise.all([
						aiResponse.text(),
						realResponse.text(),
					]);
					const signText = signResponse && signResponse.ok ? await signResponse.text() : '';
					aiImages = unique(extractImageFilenames(aiText, 'ai/'));
					realImages = unique(extractImageFilenames(realText, 'real/'));
					signImages = unique(extractImageFilenames(signText, 'ai_sign/'));
				}

				// Fixed 10 rounds per game
				totalRounds = 20;

				console.log('Loaded image lists:', { ai: aiImages.length, real: realImages.length, sign: signImages.length });
				console.log(`Game will have ${totalRounds} rounds`);
			} catch (error) {
				console.error('Could not load images.');
				setScanStatus(
					'Could not load images. If you are opening this as a local file, make sure image_manifest.js exists next to this HTML (real_or_ai/image_manifest.js).'
				);
				aiImages = [];
				realImages = [];
				signImages = [];
				totalRounds = 0;
			}
		}

		// Extract image filenames from directory listing HTML
		function extractImageFilenames(html, folder) {
			const imageExtensions = /\.(jpg|jpeg|png|gif|bmp|webp)$/i;
			const images = [];

			// Look for href links in directory listing
			const hrefRegex = /href="([^"]+)"/gi;
			let match;

			while ((match = hrefRegex.exec(html)) !== null) {
				const filename = match[1];
				// Skip parent directory links and non-image files
				if (filename !== '../' && imageExtensions.test(filename)) {
					images.push(folder + filename);
				}
			}

			return images;
		}
		let pairs = [];
		let currentRound = 0;
		let score = 0;

		// ── High Score System ─────────────────────
		const ROAI_HS_KEY = 'realOrAi-highscores';
		let roaiLastNewHsIdx = -1;
		let roaiPendingScore = null;

		function getRoaiHighScores() {
			try { return JSON.parse(localStorage.getItem(ROAI_HS_KEY)) || []; } catch { return []; }
		}
		function addRoaiHighScore(scoreVal, totalVal, nameVal) {
			const list = getRoaiHighScores();
			const pct = totalVal > 0 ? Math.round((scoreVal / totalVal) * 100) : 0;
			const entry = { score: scoreVal, total: totalVal, pct: pct, name: (nameVal || '').toUpperCase(), date: new Date().toISOString() };
			let inserted = false;
			for (let i = 0; i < list.length; i++) {
				const existPct = list[i].pct != null ? list[i].pct : (list[i].total > 0 ? Math.round((list[i].score / list[i].total) * 100) : 0);
				if (pct > existPct) { list.splice(i, 0, entry); inserted = true; roaiLastNewHsIdx = i; break; }
			}
			if (!inserted && list.length < 5) { roaiLastNewHsIdx = list.length; list.push(entry); inserted = true; }
			else if (!inserted) { roaiLastNewHsIdx = -1; return false; }
			if (list.length > 5) list.length = 5;
			localStorage.setItem(ROAI_HS_KEY, JSON.stringify(list));
			if (window.GHScores) GHScores.save('real_or_ai', ROAI_HS_KEY);
			return true;
		}
		function renderRoaiHighScores() {
			const list = getRoaiHighScores();
			const wrap = document.getElementById('roai-hs-wrap');
			if (list.length === 0) { wrap.innerHTML = '<p style="text-align:center;color:#888;padding:30px 0;">No scores yet.</p>'; return; }
			const mc = ['#ffd700', '#c0c0c0', '#cd7f32'];
			let html = '<table style="width:100%;border-collapse:collapse;"><thead><tr><th style="font-size:11px;text-transform:uppercase;color:#999;padding:6px 8px;text-align:center;border-bottom:1px solid #555;">#</th><th style="font-size:11px;text-transform:uppercase;color:#999;padding:6px 8px;text-align:left;border-bottom:1px solid #555;">Score</th><th style="font-size:11px;text-transform:uppercase;color:#999;padding:6px 8px;text-align:left;border-bottom:1px solid #555;">Name</th><th style="font-size:11px;text-transform:uppercase;color:#999;padding:6px 8px;text-align:left;border-bottom:1px solid #555;">Date</th></tr></thead><tbody>';
			list.forEach((e, i) => {
				const bg = i === roaiLastNewHsIdx ? 'background:rgba(255,215,0,0.06);' : '';
				const col = i < 3 ? `color:${mc[i]};` : '';
				const d = new Date(e.date);
				const ds = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
				const ePct = e.pct != null ? e.pct : (e.total > 0 ? Math.round((e.score / e.total) * 100) : 0);
				html += `<tr style="${bg}"><td style="text-align:center;font-weight:700;padding:10px 8px;border-bottom:1px solid #444;${col}">${i + 1}</td><td style="font-weight:900;color:#09f;padding:10px 8px;border-bottom:1px solid #444;">${ePct}%</td><td style="font-weight:700;padding:10px 8px;border-bottom:1px solid #444;">${e.name || '---'}</td><td style="font-size:11px;color:#888;padding:10px 8px;border-bottom:1px solid #444;">${ds}</td></tr>`;
			});
			html += '</tbody></table>';
			wrap.innerHTML = html;
		}
		function showRoaiHighScores() { renderRoaiHighScores(); document.getElementById('roai-hs-modal').style.display = 'flex'; }
		function hideRoaiHighScores() { document.getElementById('roai-hs-modal').style.display = 'none'; roaiLastNewHsIdx = -1; }
		function saveRoaiName() {
			const inp = document.getElementById('roai-hs-name');
			if (!inp || inp.disabled) return;
			const name = inp.value.replace(/[^a-zA-Z]/g, '').substring(0, 6).toUpperCase();
			if (roaiPendingScore !== null) { addRoaiHighScore(roaiPendingScore.score, roaiPendingScore.total, name); roaiPendingScore = null; }
			inp.disabled = true; inp.value = name || '------'; inp.style.borderColor = '#3f3';
			const btn = document.getElementById('roai-save-name');
			if (btn) { btn.textContent = '\u2713'; btn.style.background = '#3f3'; btn.style.color = '#222'; btn.disabled = true; }
			const msg = document.getElementById('roai-name-saved');
			if (msg) msg.style.display = 'block';
		}

		document.getElementById('roaiScoresBtn').addEventListener('click', showRoaiHighScores);
		document.getElementById('roaiHsClose').addEventListener('click', hideRoaiHighScores);

		function randomBit() {
			if (window.crypto && typeof crypto.getRandomValues === 'function') {
				const buf = new Uint8Array(1);
				crypto.getRandomValues(buf);
				return (buf[0] & 1) === 1;
			}
			return Math.random() < 0.5;
		}

		function randomIndex(count) {
			if (count <= 1) return 0;
			if (window.crypto && typeof crypto.getRandomValues === 'function') {
				const max = 0x100000000;
				const limit = max - (max % count);
				const buf = new Uint32Array(1);
				let value;
				do {
					crypto.getRandomValues(buf);
					value = buf[0];
				} while (value >= limit);
				return value % count;
			}
			return Math.floor(Math.random() * count);
		}

		function shuffle(arr) {
			for (let i = arr.length - 1; i > 0; i--) {
				const j = randomIndex(i + 1);
				[arr[i], arr[j]] = [arr[j], arr[i]];
			}
			return arr;
		}

		function extractNumericId(path, prefix) {
			// Matches: ai/ai_1234.jpg or real/real_1234.png
			// Also tolerant of different folder names and extensions.
			const rx = new RegExp(String.raw`(?:^|/)${prefix}_(\d+)\.[a-z0-9]+$`, 'i');
			const m = path.match(rx);
			return m ? Number(m[1]) : null;
		}

		function indexImagesById(list, prefix) {
			const map = new Map();
			for (const path of list) {
				const id = extractNumericId(path, prefix);
				if (id == null || map.has(id)) continue;
				map.set(id, path);
			}
			return map;
		}

		function signPathForId(id) {
			return `ai_sign/ai_sign_${String(id).padStart(4, '0')}.jpg`;
		}

		function pickPairs() {
			const aiById = indexImagesById(aiImages, 'ai');
			const realById = indexImagesById(realImages, 'real');
			const signById = indexImagesById(signImages, 'ai_sign');
			const requireSign = signById.size > 0;
			const ids = [];
			for (const id of aiById.keys()) {
				if (!realById.has(id)) continue;
				if (requireSign && !signById.has(id)) continue;
				ids.push(id);
			}
			shuffle(ids);
			const count = Math.min(totalRounds || 20, ids.length);
			pairs = [];
			for (let i = 0; i < count; i++) {
				const id = ids[i];
				pairs.push({
					id,
					ai: aiById.get(id),
					real: realById.get(id),
					sign: signById.get(id) || signPathForId(id),
					// Independent cryptographic coin flip. Not based on id or round number.
					aiOnLeft: randomBit()
				});
			}
		}

		function fitPlayfield() {
			const box = document.querySelector('.game-container');
			if (box) box.scrollTop = 0;
			window.scrollTo(0, 0);
		}

		function waitForImgLoad(img) {
			return new Promise((resolve) => {
				const finish = () => resolve(img.naturalWidth > 0);
				if (img.complete) { finish(); return; }
				img.addEventListener('load', finish, { once: true });
				img.addEventListener('error', () => resolve(false), { once: true });
			});
		}

		let brokenSkips = 0;

		async function showRound() {
			fitPlayfield();
			document.getElementById('feedback').textContent = '';
			document.getElementById('nextBtn').style.display = 'none';
			document.getElementById('restartBtn').style.display = 'none';
			const pct = pairs.length > 0 ? Math.round((score / pairs.length) * 100) : 0;
			document.getElementById('score').textContent = `Score: ${pct}% (${score}/${pairs.length})`;
			document.getElementById('round-info').textContent = `Round ${currentRound + 1} of ${pairs.length}`;
			const pair = pairs[currentRound];
			const leftIsAI = pair.aiOnLeft === true;
			const leftImg = leftIsAI ? pair.ai : pair.real;
			const rightImg = leftIsAI ? pair.real : pair.ai;
			const imagesDiv = document.getElementById('images');
			imagesDiv.innerHTML = '<p>Loading images...</p>';
			// Create image elements with wrappers and zoom buttons
			const imgElements = [];
			function makeImgWrap(src, alt, choiceType) {
				const wrap = document.createElement('div');
				wrap.className = 'img-wrap';
				wrap.style.visibility = 'hidden';
				const img = document.createElement('img');
				img.src = src;
				img.alt = alt;
				img.draggable = false;
				img.oncontextmenu = (e) => e.preventDefault();
				img.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
				img.addEventListener('click', (e) => {
					e.stopPropagation();
					e.preventDefault();
					openImageViewer(img.src);
				});
				const zoomBtn = document.createElement('button');
				zoomBtn.className = 'img-zoom-btn';
				zoomBtn.textContent = '⛶';
				zoomBtn.title = 'View fullscreen';
				zoomBtn.onclick = (e) => { e.stopPropagation(); toggleFullscreenImg(img.src); };
				const chooseBtn = document.createElement('button');
				chooseBtn.className = 'btn choose-btn';
				chooseBtn.textContent = '👆 This is AI';
				chooseBtn.onclick = () => handleChoice(choiceType, wrap);
				wrap.dataset.kind = choiceType;
				wrap.appendChild(img);
				wrap.appendChild(zoomBtn);
				wrap.appendChild(chooseBtn);
				imgElements.push(img);
				return wrap;
			}
			const leftWrap = makeImgWrap(leftImg, 'Left Image', leftIsAI ? 'ai' : 'real');
			const rightWrap = makeImgWrap(rightImg, 'Right Image', leftIsAI ? 'real' : 'ai');
			if (pair.sign) {
				const preload = new Image();
				preload.src = pair.sign;
			}
			// Insert into DOM (hidden) so the browser starts loading
			imagesDiv.innerHTML = '';
			imagesDiv.appendChild(leftWrap);
			imagesDiv.appendChild(rightWrap);
			// Wait for both images to load, then reveal. Skip a pair if either file is missing.
			const loaded = await Promise.all(imgElements.map(waitForImgLoad));
			if (loaded.some(ok => !ok)) {
				pairs.splice(currentRound, 1);
				brokenSkips++;
				if (brokenSkips > 40 || pairs.length === 0) {
					document.getElementById('round-info').textContent = 'Error: Images failed to load!';
					document.getElementById('images').innerHTML = '<p>A matched pair was listed, but the files could not be opened. Refresh after checking ai/ and real/.</p>';
					return;
				}
				if (currentRound >= pairs.length) {
					showResults();
					return;
				}
				await showRound();
				return;
			}
			brokenSkips = 0;
			leftWrap.style.visibility = '';
			rightWrap.style.visibility = '';
		}

		const imageViewer = {
			scale: 1,
			tx: 0,
			ty: 0,
			dragging: false,
			dragMoved: false,
			pointerId: null,
			startX: 0,
			startY: 0,
			originTx: 0,
			originTy: 0
		};

		function computeViewerZoom(state, clientX, clientY, width, height, factor) {
			const next = Math.min(8, Math.max(1, state.scale * factor));
			const ratio = state.scale === 0 ? 1 : next / state.scale;
			let tx = state.tx * ratio + (clientX - width / 2) * (1 - ratio);
			let ty = state.ty * ratio + (clientY - height / 2) * (1 - ratio);
			if (next <= 1.001) return { scale: 1, tx: 0, ty: 0 };
			return { scale: next, tx, ty };
		}

		function applyViewerTransform() {
			const img = document.getElementById('fs-img');
			const overlay = document.getElementById('img-fullscreen');
			img.style.transform = `translate(${imageViewer.tx}px, ${imageViewer.ty}px) scale(${imageViewer.scale})`;
			overlay.classList.toggle('zoomed', imageViewer.scale > 1.001);
			overlay.classList.toggle('dragging', imageViewer.dragging);
		}

		function resetViewerTransform() {
			imageViewer.scale = 1;
			imageViewer.tx = 0;
			imageViewer.ty = 0;
			imageViewer.dragging = false;
			imageViewer.dragMoved = false;
			imageViewer.pointerId = null;
			applyViewerTransform();
		}

		function openImageViewer(src) {
			const overlay = document.getElementById('img-fullscreen');
			const img = document.getElementById('fs-img');
			resetViewerTransform();
			img.src = src;
			overlay.classList.add('show');
		}

		function closeImageViewer() {
			document.getElementById('img-fullscreen').classList.remove('show');
			resetViewerTransform();
		}

		function zoomViewerAt(clientX, clientY, factor) {
			const next = computeViewerZoom(
				imageViewer,
				clientX,
				clientY,
				window.innerWidth,
				window.innerHeight,
				factor
			);
			imageViewer.scale = next.scale;
			imageViewer.tx = next.tx;
			imageViewer.ty = next.ty;
			applyViewerTransform();
		}

		function toggleFullscreenImg(src) {
			const overlay = document.getElementById('img-fullscreen');
			const fsImg = document.getElementById('fs-img');
			if (overlay.classList.contains('show') && fsImg.src.endsWith(src) && imageViewer.scale <= 1.001) {
				closeImageViewer();
			} else {
				openImageViewer(src);
			}
		}

		(function initImageViewer() {
			const overlay = document.getElementById('img-fullscreen');
			const img = document.getElementById('fs-img');
			overlay.addEventListener('wheel', (e) => {
				if (!overlay.classList.contains('show')) return;
				e.preventDefault();
				e.stopPropagation();
				let dy = e.deltaY;
				if (e.deltaMode === 1) dy *= 16;
				else if (e.deltaMode === 2) dy *= window.innerHeight;
				zoomViewerAt(e.clientX, e.clientY, Math.exp(-dy * 0.0016));
			}, { passive: false });

			overlay.addEventListener('pointerdown', (e) => {
				if (!overlay.classList.contains('show') || e.button !== 0) return;
				if (e.target.closest && e.target.closest('#fs-close')) return;
				if (e.target === img && imageViewer.scale > 1.001) {
					imageViewer.dragging = true;
					imageViewer.dragMoved = false;
					imageViewer.pointerId = e.pointerId;
					imageViewer.startX = e.clientX;
					imageViewer.startY = e.clientY;
					imageViewer.originTx = imageViewer.tx;
					imageViewer.originTy = imageViewer.ty;
					overlay.setPointerCapture(e.pointerId);
					applyViewerTransform();
					e.preventDefault();
				}
			});

			overlay.addEventListener('pointermove', (e) => {
				if (!imageViewer.dragging || e.pointerId !== imageViewer.pointerId) return;
				const dx = e.clientX - imageViewer.startX;
				const dy = e.clientY - imageViewer.startY;
				if (Math.hypot(dx, dy) > 3) imageViewer.dragMoved = true;
				imageViewer.tx = imageViewer.originTx + dx;
				imageViewer.ty = imageViewer.originTy + dy;
				applyViewerTransform();
			});

			function endDrag(e) {
				if (!imageViewer.dragging || (e && e.pointerId !== imageViewer.pointerId)) return;
				imageViewer.dragging = false;
				imageViewer.pointerId = null;
				applyViewerTransform();
			}

			overlay.addEventListener('pointerup', (e) => {
				const wasDrag = imageViewer.dragging && imageViewer.dragMoved;
				endDrag(e);
				if (wasDrag) return;
				if (e.target.closest && e.target.closest('#fs-close')) return;
				if (e.target === img && imageViewer.scale > 1.001) return;
				closeImageViewer();
			});
			overlay.addEventListener('pointercancel', endDrag);
			document.getElementById('fs-close').addEventListener('click', (e) => {
				e.stopPropagation();
				closeImageViewer();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && overlay.classList.contains('show')) {
					e.preventDefault();
					closeImageViewer();
				}
			});
		})();

		function revealAiSign(pair) {
			if (!pair || !pair.sign) return;
			const aiWrap = document.querySelector('#images .img-wrap[data-kind="ai"]');
			const img = aiWrap ? aiWrap.querySelector('img') : null;
			if (!img || img.dataset.signShown === '1') return;
			img.dataset.signShown = '1';
			img.alt = 'Revealed AI image';
			img.addEventListener('error', () => {
				if (pair.ai) img.src = pair.ai;
			}, { once: true });
			img.src = pair.sign;
		}

		function handleChoice(selected, wrapElem) {
			// Disable all choose buttons
			document.querySelectorAll('.choose-btn').forEach(btn => btn.disabled = true);
			if (selected === 'ai') {
				score++;
				wrapElem.classList.add('right');
				document.getElementById('feedback').textContent = 'Correct! That is the AI image.';
			} else {
				wrapElem.classList.add('wrong');
				document.getElementById('feedback').textContent = 'Wrong! That is a real image.';
			}
			// Swap the AI box only, after the choice, whichever side it is on.
			revealAiSign(pairs[currentRound]);
			const pctNow = pairs.length > 0 ? Math.round((score / pairs.length) * 100) : 0;
			document.getElementById('score').textContent = `Score: ${pctNow}% (${score}/${pairs.length})`;
			document.getElementById('nextBtn').style.display = 'inline-block';
			if (currentRound === pairs.length - 1) {
				document.getElementById('nextBtn').textContent = 'See Results';
			} else {
				document.getElementById('nextBtn').textContent = 'Next';
			}
		}

		document.getElementById('nextBtn').onclick = async function () {
			currentRound++;
			if (currentRound < pairs.length) {
				await showRound();
			} else {
				showResults();
			}
		};

		function showResults() {
			fitPlayfield();
			document.getElementById('images').innerHTML = '';
			document.getElementById('round-info').textContent = 'Game Over!';
			document.getElementById('score').textContent = '';
			document.getElementById('nextBtn').style.display = 'none';

			const finalPct = pairs.length > 0 ? Math.round((score / pairs.length) * 100) : 0;
			const list = getRoaiHighScores();
			const lastPct = list.length > 0 ? (list[list.length - 1].pct != null ? list[list.length - 1].pct : (list[list.length - 1].total > 0 ? Math.round((list[list.length - 1].score / list[list.length - 1].total) * 100) : 0)) : 0;
			const makesLb = score > 0 && (list.length < 5 || finalPct > lastPct);
			roaiPendingScore = { score, total: pairs.length };

			let feedHtml = `Your final score: ${finalPct}% (${score}/${pairs.length})`;
			if (makesLb) {
				const topPct = list.length > 0 ? (list[0].pct != null ? list[0].pct : (list[0].total > 0 ? Math.round((list[0].score / list[0].total) * 100) : 0)) : 0;
				const isNewBest = list.length === 0 || finalPct > topPct;
				feedHtml += isNewBest ? '<br>\ud83c\udfc6 New High Score!' : '<br>\ud83d\udccb You made the leaderboard!';
				feedHtml += `<div style="margin:10px 0;">
					<div style="font-size:13px;color:#ffd700;margin-bottom:6px;">Enter your name:</div>
					<div style="display:flex;align-items:center;justify-content:center;gap:8px;">
						<input id="roai-hs-name" type="text" maxlength="6" autocomplete="off" spellcheck="false" style="width:120px;padding:6px 10px;font-size:18px;font-weight:bold;text-align:center;
							background:#444;color:#fff;border:2px solid #09f;border-radius:8px;outline:none;
							text-transform:uppercase;letter-spacing:2px;font-family:inherit;" placeholder="______">
						<button id="roai-save-name" class="btn" style="margin-top:0;padding:6px 14px;font-size:14px;">Save</button>
					</div>
					<div id="roai-name-saved" style="font-size:11px;color:#3f3;margin-top:4px;display:none;">&#10003; Name saved!</div>
					<div style="font-size:10px;color:#888;margin-top:3px;">Up to 6 letters</div>
				</div>`;
			} else {
				addRoaiHighScore(score, pairs.length, '');
			}

			document.getElementById('feedback').innerHTML = feedHtml;
			document.getElementById('restartBtn').style.display = 'inline-block';

			if (makesLb) {
				setTimeout(() => {
					const saveBtn = document.getElementById('roai-save-name');
					const nameInp = document.getElementById('roai-hs-name');
					if (saveBtn) saveBtn.addEventListener('click', saveRoaiName);
					if (nameInp) {
						nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRoaiName(); } });
						nameInp.focus();
					}
				}, 50);
			}
		}

		document.getElementById('restartBtn').onclick = function () {
			// Auto-save pending
			if (roaiPendingScore !== null) {
				const inp = document.getElementById('roai-hs-name');
				const name = inp && !inp.disabled ? inp.value.replace(/[^a-zA-Z]/g, '').substring(0, 6).toUpperCase() : '';
				addRoaiHighScore(roaiPendingScore.score, roaiPendingScore.total, name);
				roaiPendingScore = null;
			}
			roaiLastNewHsIdx = -1;
			startGame();
		};

		async function startGame() {
			fitPlayfield();
			brokenSkips = 0;
			document.getElementById('feedback').textContent = '';
			document.getElementById('nextBtn').style.display = 'none';
			document.getElementById('restartBtn').style.display = 'none';
			document.getElementById('score').textContent = '';
			// Show loading message
			document.getElementById('round-info').textContent = 'Loading images...';
			document.getElementById('images').innerHTML = '<p>Scanning folders for images...</p>';

			// Load images from folders
			await loadImagesFromFolders();

			// Check if we have enough images to play
			if (aiImages.length === 0 || realImages.length === 0) {
				document.getElementById('round-info').textContent = 'Error: No images found!';
				document.getElementById('images').innerHTML = '<p>Please make sure you have images in both ai/ and real/ folders.</p>';
				return;
			}

			// Start the game
			pickPairs();
			if (pairs.length === 0) {
				document.getElementById('round-info').textContent = 'Error: No matching pairs found!';
				document.getElementById('images').innerHTML = '<p>Each round needs real_####, ai_####, and ai_sign/ai_sign_#### with the same number.</p>';
				return;
			}
			currentRound = 0;
			score = 0;
			await showRound();
		}

		function enterBrowserFullscreen() {
			if (document.fullscreenElement || document.webkitFullscreenElement) return;
			const el = document.documentElement;
			const request = el.requestFullscreen || el.webkitRequestFullscreen;
			if (!request) return;
			try {
				const pending = request.call(el);
				if (pending && typeof pending.catch === 'function') pending.catch(() => { });
			} catch (err) { }
		}

		// Fill the window immediately. Browser chrome can only hide when the
		// environment allows fullscreen without a click; do not wait for one.
		enterBrowserFullscreen();

		// Start the game on load
		startGame();
	</script>
	<script src="../scripts/github-scores.js"></script>
	<script>
		if (window.GHScores) GHScores.load('real_or_ai', 'realOrAi-highscores', 5).catch(() => { });
	</script>
	<script>window.__mcNoAutoFullscreen = true;</script>
	<script src="../scripts/mobile-controls.js"></script>
</body>
